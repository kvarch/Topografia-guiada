<title>KV Terreno Guiado · Curvas de Nível 3D</title>

<style>
/* ══════════════════════════════════════════════════════════════
   MATERIAL DESIGN 3 · TOKENS OFICIAIS KV (LIGHT)
   ══════════════════════════════════════════════════════════════ */
:root, .light {
  --md-sys-color-primary: rgb(0 103 124);
  --md-sys-color-surface-tint: rgb(0 103 124);
  --md-sys-color-on-primary: rgb(255 255 255);
  --md-sys-color-primary-container: rgb(0 172 205);
  --md-sys-color-on-primary-container: rgb(0 58 71);
  --md-sys-color-secondary: rgb(30 30 30);
  --md-sys-color-on-secondary: rgb(255 255 255);
  --md-sys-color-secondary-container: rgb(51 51 51);
  --md-sys-color-on-secondary-container: rgb(156 155 155);
  --md-sys-color-tertiary: rgb(38 39 125);
  --md-sys-color-on-tertiary: rgb(255 255 255);
  --md-sys-color-tertiary-container: rgb(62 64 149);
  --md-sys-color-on-tertiary-container: rgb(178 179 255);
  --md-sys-color-error: rgb(179 33 0);
  --md-sys-color-on-error: rgb(255 255 255);
  --md-sys-color-error-container: rgb(216 57 24);
  --md-sys-color-on-error-container: rgb(255 251 255);
  --md-sys-color-background: rgb(245 250 253);
  --md-sys-color-on-background: rgb(23 28 30);
  --md-sys-color-surface: rgb(249 249 249);
  --md-sys-color-on-surface: rgb(27 27 27);
  --md-sys-color-surface-variant: rgb(224 227 227);
  --md-sys-color-on-surface-variant: rgb(68 71 72);
  --md-sys-color-outline: rgb(116 120 120);
  --md-sys-color-outline-variant: rgb(196 199 199);
  --md-sys-color-shadow: rgb(0 0 0);
  --md-sys-color-scrim: rgb(0 0 0);
  --md-sys-color-inverse-surface: rgb(48 48 48);
  --md-sys-color-inverse-on-surface: rgb(241 241 241);
  --md-sys-color-inverse-primary: rgb(84 214 248);
  --md-sys-color-surface-dim: rgb(218 218 218);
  --md-sys-color-surface-bright: rgb(249 249 249);
  --md-sys-color-surface-container-lowest: rgb(255 255 255);
  --md-sys-color-surface-container-low: rgb(243 243 243);
  --md-sys-color-surface-container: rgb(238 238 238);
  --md-sys-color-surface-container-high: rgb(232 232 232);
  --md-sys-color-surface-container-highest: rgb(226 226 226);
  --md-extended-color-custom-color1-color: rgb(0 108 77);
  --md-extended-color-custom-color1-on-color: rgb(255 255 255);
  --md-extended-color-custom-color1-color-container: rgb(47 175 131);
  --md-extended-color-custom-color1-on-color-container: rgb(0 59 41);
  --kv-logo-pos: block;
  --kv-logo-neg: none;
}
/* ══════════════════════════════════════════════════════════════
   MATERIAL DESIGN 3 · TOKENS OFICIAIS KV (DARK)
   ══════════════════════════════════════════════════════════════ */
.dark {
  --md-sys-color-primary: rgb(84 214 248);
  --md-sys-color-surface-tint: rgb(84 214 248);
  --md-sys-color-on-primary: rgb(0 54 66);
  --md-sys-color-primary-container: rgb(0 172 205);
  --md-sys-color-on-primary-container: rgb(0 58 71);
  --md-sys-color-secondary: rgb(200 198 198);
  --md-sys-color-on-secondary: rgb(48 48 48);
  --md-sys-color-secondary-container: rgb(51 51 51);
  --md-sys-color-on-secondary-container: rgb(156 155 155);
  --md-sys-color-tertiary: rgb(192 193 255);
  --md-sys-color-on-tertiary: rgb(35 36 122);
  --md-sys-color-tertiary-container: rgb(62 64 149);
  --md-sys-color-on-tertiary-container: rgb(178 179 255);
  --md-sys-color-error: rgb(255 180 164);
  --md-sys-color-on-error: rgb(99 14 0);
  --md-sys-color-error-container: rgb(255 86 50);
  --md-sys-color-on-error-container: rgb(38 2 0);
  --md-sys-color-background: rgb(15 20 22);
  --md-sys-color-on-background: rgb(222 227 230);
  --md-sys-color-surface: rgb(19 19 19);
  --md-sys-color-on-surface: rgb(226 226 226);
  --md-sys-color-surface-variant: rgb(68 71 72);
  --md-sys-color-on-surface-variant: rgb(196 199 199);
  --md-sys-color-outline: rgb(142 145 146);
  --md-sys-color-outline-variant: rgb(68 71 72);
  --md-sys-color-inverse-surface: rgb(226 226 226);
  --md-sys-color-inverse-on-surface: rgb(48 48 48);
  --md-sys-color-inverse-primary: rgb(0 103 124);
  --md-sys-color-surface-dim: rgb(19 19 19);
  --md-sys-color-surface-bright: rgb(57 57 57);
  --md-sys-color-surface-container-lowest: rgb(14 14 14);
  --md-sys-color-surface-container-low: rgb(27 27 27);
  --md-sys-color-surface-container: rgb(31 31 31);
  --md-sys-color-surface-container-high: rgb(42 42 42);
  --md-sys-color-surface-container-highest: rgb(53 53 53);
  --md-extended-color-custom-color1-color: rgb(100 220 172);
  --md-extended-color-custom-color1-on-color: rgb(0 56 39);
  --md-extended-color-custom-color1-color-container: rgb(47 175 131);
  --md-extended-color-custom-color1-on-color-container: rgb(0 59 41);
  --kv-logo-pos: none;
  --kv-logo-neg: block;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;width:100%;overflow:hidden;}
body{
  font-family:'Hedley New','Hind',system-ui,-apple-system,sans-serif;
  background-color:var(--md-sys-color-background);
  color:var(--md-sys-color-on-background);
  font-size:13px;line-height:1.45;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--md-sys-color-surface-container-low);}
::-webkit-scrollbar-thumb{background:var(--md-sys-color-outline-variant);border-radius:0;}

:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px;}

/* ── Layout ─────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.app-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;min-height:64px;
  background-color:var(--md-sys-color-surface-container-lowest);
  border-bottom:1px solid var(--md-sys-color-outline-variant);
  flex-shrink:0;
}
.logo-container{display:flex;flex-direction:column;gap:2px;min-width:0;}
.brand-logo{height:26px;width:auto;display:block;}
.brand-logo.pos{display:var(--kv-logo-pos);}
.brand-logo.neg{display:var(--kv-logo-neg);}
.app-title{
  font-size:11px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;
  color:var(--md-sys-color-primary);margin-top:4px;
}
main{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.app-footer{
  flex-shrink:0;padding:8px 16px;
  border-top:1px solid var(--md-sys-color-outline-variant);
  background-color:var(--md-sys-color-surface-container-lowest);
  font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}

/* ── Abas ───────────────────────────────────────────────────── */
.tabs{
  display:flex;flex-shrink:0;
  background-color:var(--md-sys-color-surface-container-low);
  border-bottom:1px solid var(--md-sys-color-outline-variant);
}
.tab{
  flex:1;min-height:48px;min-width:48px;padding:6px 4px;border:0;border-radius:0;
  border-bottom:2px solid transparent;background:transparent;cursor:pointer;
  font-family:inherit;font-size:10px;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:color .15s,border-color .15s;
}
.tab:hover{color:var(--md-sys-color-on-surface);}
.tab[aria-selected="true"]{
  color:var(--md-sys-color-primary);
  border-bottom-color:var(--md-sys-color-primary);
  background-color:var(--md-sys-color-surface-container-lowest);
}

/* ── Cards ──────────────────────────────────────────────────── */
.card{
  background-color:var(--md-sys-color-surface-container-lowest);
  border:1px solid var(--md-sys-color-outline-variant);
  border-radius:0;box-shadow:none;padding:12px;
}
.card-title{
  font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.hint{font-size:11px;color:var(--md-sys-color-on-surface-variant);line-height:1.5;}

/* ── Botões ─────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;padding:0 14px;border-radius:0;box-shadow:none;
  font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid transparent;transition:background-color .15s,color .15s,border-color .15s;
  text-align:center;line-height:1.2;
}
.btn:disabled{opacity:.38;cursor:not-allowed;}
.btn-pri{background-color:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);}
.btn-pri:not(:disabled):hover{background-color:var(--md-sys-color-on-primary-container);color:#fff;}
.btn-out{background-color:transparent;color:var(--md-sys-color-on-surface);border-color:var(--md-sys-color-outline);}
.btn-out:not(:disabled):hover{background-color:var(--md-sys-color-surface-container);}
.btn-ok{background-color:var(--md-extended-color-custom-color1-color-container);color:var(--md-extended-color-custom-color1-on-color-container);}
.btn-ok:not(:disabled):hover{background-color:var(--md-extended-color-custom-color1-color);color:var(--md-extended-color-custom-color1-on-color);}
.btn-err{background-color:transparent;color:var(--md-sys-color-error);border-color:var(--md-sys-color-error);}
.btn-err:not(:disabled):hover{background-color:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);}
.btn-icon{min-width:48px;min-height:48px;padding:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}

/* ── Campos ─────────────────────────────────────────────────── */
.field-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.field-label{
  font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);flex-shrink:0;width:96px;
}
.fld{
  flex:1;min-height:48px;padding:0 12px;border-radius:0;box-shadow:none;
  background-color:var(--md-sys-color-surface-container-low);
  color:var(--md-sys-color-on-surface);
  border:1px solid var(--md-sys-color-outline);
  font-family:inherit;font-size:13px;outline:none;width:100%;
}
.fld:focus-visible{border-color:var(--md-sys-color-primary);}
.fld-sm{min-height:40px;padding:0 8px;font-size:12px;text-align:right;}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;}
.chk input{width:20px;height:20px;accent-color:var(--md-sys-color-primary);cursor:pointer;flex-shrink:0;}
.chk span{font-size:12px;color:var(--md-sys-color-on-surface);}

/* ── Segmentado ─────────────────────────────────────────────── */
.seg{display:flex;border:1px solid var(--md-sys-color-outline);border-radius:0;overflow:hidden;}
.seg button{
  flex:1;min-height:48px;border:0;border-radius:0;cursor:pointer;
  background:transparent;color:var(--md-sys-color-on-surface-variant);
  font-family:inherit;font-size:11px;font-weight:500;
  border-left:1px solid var(--md-sys-color-outline-variant);
}
.seg button:first-child{border-left:0;}
.seg button[aria-pressed="true"]{
  background-color:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);font-weight:600;
}

/* ── Tabela de curvas ───────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:11px;}
.tbl th{
  text-align:left;font-size:9px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  padding:6px 6px;border-bottom:1px solid var(--md-sys-color-outline-variant);
}
.tbl td{padding:3px 6px;border-bottom:1px solid var(--md-sys-color-outline-variant);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
.tbl-wrap{max-height:220px;overflow-y:auto;border:1px solid var(--md-sys-color-outline-variant);}
.ord{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:0;flex-shrink:0;
  background-color:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);
  font-size:10px;font-weight:700;
}

/* ── Slots de uso do solo ───────────────────────────────────── */
.slot{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border:1px solid var(--md-sys-color-outline-variant);border-radius:0;
  background-color:var(--md-sys-color-surface-container-low);
}
.slot.on{border-color:var(--md-sys-color-primary);}
.swatch{width:14px;height:14px;flex-shrink:0;border:1px solid var(--md-sys-color-outline);}
.slot-name{font-size:12px;font-weight:600;flex:1;min-width:0;}
.slot-meta{font-size:10px;color:var(--md-sys-color-on-surface-variant);}

/* ── Estados / avisos ───────────────────────────────────────── */
.alert{
  padding:8px 10px;border-radius:0;font-size:11px;line-height:1.45;
  border:1px solid var(--md-sys-color-outline-variant);
}
.alert-ok{
  color:var(--md-extended-color-custom-color1-on-color-container);
  background-color:var(--md-extended-color-custom-color1-color-container);
  border-color:var(--md-extended-color-custom-color1-color);
}
.alert-err{
  color:var(--md-sys-color-on-error-container);
  background-color:var(--md-sys-color-error-container);
  border-color:var(--md-sys-color-error);
}
.alert-info{
  background-color:var(--md-sys-color-surface-container);
  color:var(--md-sys-color-on-surface-variant);
}

/* ── Progresso ──────────────────────────────────────────────── */
.pb{height:3px;background-color:var(--md-sys-color-surface-container-highest);overflow:hidden;margin-top:8px;}
.pf{height:100%;background-color:var(--md-sys-color-primary);transition:width .25s;}

/* ── Log ────────────────────────────────────────────────────── */
.log{
  background-color:var(--md-sys-color-surface-container-low);
  border:1px solid var(--md-sys-color-outline-variant);
  font-family:'Courier New',ui-monospace,monospace;
  font-size:10.5px;line-height:1.55;overflow-y:auto;padding:8px;
  height:150px;white-space:pre-wrap;word-break:break-word;
}
.l-ts{color:var(--md-sys-color-outline);}
.l-ok{color:var(--md-extended-color-custom-color1-color);}
.l-err{color:var(--md-sys-color-error);}
.l-warn{color:rgb(200 140 0);}
.dark .l-warn{color:rgb(250 190 60);}
.l-info{color:var(--md-sys-color-on-surface-variant);}

/* ── Dados / stats ──────────────────────────────────────────── */
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;}
.kv dt{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant);}
.kv dd{font-size:12px;font-weight:600;color:var(--md-sys-color-primary);text-align:right;}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>

// rawSections chega como array, {features:[]} ou objeto com chaves numéricas.
function normSections(rs){
  if(!rs) return[];
  if(Array.isArray(rs)) return rs.filter(f=>f&&f.geometry);
  if(Array.isArray(rs.features)) return rs.features.filter(f=>f&&f.geometry);
  if(typeof rs==='object') return Object.values(rs).filter(f=>f&&f.geometry);
  return[];
}
function linhasOf(g){
  if(!g) return[];
  if(g.type==='LineString') return[g.coordinates];
  if(g.type==='MultiLineString') return g.coordinates;
  return[];
}
function isPoly(f){return['Polygon','MultiPolygon'].includes(f?.geometry?.type);}
function fid(f){return f?.properties?.id??f?.id??null;}

// Insere vértices intermediários a cada stepDeg graus (adensamento de anel).
function densifyRing(ring,stepDeg){
  if(!ring||ring.length<3) return ring||[];
  const out=[];
  for(let i=0;i<ring.length-1;i++){
    const p1=ring[i],p2=ring[i+1];
    out.push(p1);
    const d=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    if(d>stepDeg){
      const n=Math.ceil(d/stepDeg);
      for(let j=1;j<n;j++){
        const t=j/n;
        out.push([p1[0]+t*(p2[0]-p1[0]),p1[1]+t*(p2[1]-p1[1])]);
      }
    }
  }
  if(out.length) out.push(out[0]);
  return out;
}

function unionOf(feats){
  const polys=(feats||[])
    .filter(isPoly)
    .map(f=>({type:'Feature',properties:{},geometry:f.geometry}));
  if(!polys.length) return null;
  let r=polys[0];
  for(let i=1;i<polys.length;i++){
    try{const u=turf.union(r,polys[i]);if(u&&u.geometry) r=u;}catch(_){}
  }
  return r;
}

//  Diferença estrutural em relação ao app GeoSampa de referência: lá TODA
//  curva chega com a cota pronta no campo cd_numero_isovalor. Aqui só recebem
//  cota as curvas fisicamente atravessadas pela linha de corte. Uma curva
//  desenhada em vários trechos, ou fora do alcance da guia, fica sem cota e
//  some do TIN — o que abre buracos grandes e joga a interpolação no vizinho
//  mais próximo, produzindo alturas sem lógica.
//
//  Esta função fecha a lacuna: um trecho sem cota cuja extremidade encosta
//  (dentro da tolerância) na extremidade de um trecho já cotado herda a mesma
//  cota. A propagação é transitiva — trecho A cotado → B → C.
// ══════════════════════════════════════════════════════════════
function extremidadesDe(f){
  const out=[];
  for(const p of linhasOf(f?.geometry)){
    if(!p||p.length<2) continue;
    const a=p[0],b=p[p.length-1];
    out.push([Number(a[0]),Number(a[1])],[Number(b[0]),Number(b[1])]);
  }
  return out.filter(c=>isFinite(c[0])&&isFinite(c[1]));
}
function propagarCotas(cotadas,todasLinhas,tolM){
  const ids=new Set(cotadas.map(x=>x.id).filter(v=>v!==null&&v!==undefined).map(String));
  let fila=(todasLinhas||[])
    .filter(f=>{const i=fid(f);return i===null||i===undefined||!ids.has(String(i));})
    .map(f=>({f,ends:extremidadesDe(f)}))
    .filter(o=>o.ends.length);
  if(!fila.length||!cotadas.length) return{novos:[],restantes:fila.length,iter:0};
  const primeira=linhasOf(cotadas[0]?.feat?.geometry)[0];
  const latRef=primeira?.[0]?.[1];
  const kLng=Math.cos((isFinite(latRef)?latRef:-23.5)*DEG);
  const perto=(a,b)=>{
    const dx=(a[0]-b[0])*kLng,dy=a[1]-b[1];
    return Math.hypot(dx,dy)*M_PER_DEG_LAT<=tolM;
  };
  const conhecidos=cotadas.map(x=>({cota:x.cota,ends:extremidadesDe(x.feat)}));
  const novos=[];
  let mudou=true,iter=0;
  while(mudou&&iter++<40){
    mudou=false;
    const resta=[];
    for(const p of fila){
      let cota=null;
      for(const c of conhecidos){
        for(const e1 of p.ends){
          for(const e2 of c.ends){if(perto(e1,e2)){cota=c.cota;break;}}
          if(cota!==null) break;
        }
        if(cota!==null) break;
      }
      if(cota!==null){
        novos.push({id:fid(p.f),feat:p.f,cota,dist:null,nInter:0,herdada:true});
        conhecidos.push({cota,ends:p.ends});
        mudou=true;
      }else resta.push(p);
    }
    fila=resta;
  }
  return{novos,restantes:fila.length,iter};
}

// Converte feições selecionadas em polígonos utilizáveis como perímetro.
// Aceita Polygon, MultiPolygon e LINHAS fechadas (ou quase fechadas), porque
// Calçada e Rua costumam ser desenhadas com a ferramenta Linha do Giraffe.
// Cada parte de uma MultiLineString vira um polígono independente.
function feicoesParaPoligonos(list){
  const out=[];
  for(const f of(list||[])){
    if(!f?.geometry) continue;
    const g=f.geometry;
    if(g.type==='Polygon'||g.type==='MultiPolygon'){
      out.push({geom:g,gap:0,origem:g.type});
      continue;
    }
    for(const part of linhasOf(g)){
      const cs=(part||[]).map(c=>[Number(c[0]),Number(c[1])])
        .filter(c=>isFinite(c[0])&&isFinite(c[1]));
      if(cs.length<3) continue;
      const a=cs[0],b=cs[cs.length-1];
      let gap=0;
      try{gap=turf.distance(turf.point(a),turf.point(b),{units:'meters'});}catch(_){}
      const ring=gap>1e-4?[...cs,[a[0],a[1]]]:[...cs];
      if(ring.length<4) continue;
      out.push({geom:{type:'Polygon',coordinates:[ring]},gap,origem:g.type});
    }
  }
  // descarta o que não fecha área utilizável
  return out.filter(o=>{
    try{return turf.area({type:'Feature',properties:{},geometry:o.geom})>0.5;}
    catch(_){return false;}
  });
}


function buildTinIndex(feats){
  const tris=[];
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const f of feats||[]){
    const r=f?.geometry?.coordinates?.[0];
    if(!r||r.length<3) continue;
    const t={
      ax:r[0][0],ay:r[0][1],az:r[0][2]||0,
      bx:r[1][0],by:r[1][1],bz:r[1][2]||0,
      cx:r[2][0],cy:r[2][1],cz:r[2][2]||0,
    };
    t.minX=Math.min(t.ax,t.bx,t.cx);t.maxX=Math.max(t.ax,t.bx,t.cx);
    t.minY=Math.min(t.ay,t.by,t.cy);t.maxY=Math.max(t.ay,t.by,t.cy);
    tris.push(t);
    if(t.minX<minX)minX=t.minX; if(t.maxX>maxX)maxX=t.maxX;
    if(t.minY<minY)minY=t.minY; if(t.maxY>maxY)maxY=t.maxY;
  }
  if(!tris.length) return null;
  const cell=Math.max((maxX-minX)/72,(maxY-minY)/72,2e-6);
  const grid=new Map();
  tris.forEach((t,ti)=>{
    const i0=Math.floor((t.minX-minX)/cell),i1=Math.floor((t.maxX-minX)/cell);
    const j0=Math.floor((t.minY-minY)/cell),j1=Math.floor((t.maxY-minY)/cell);
    for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
      const k=i+':'+j;
      let a=grid.get(k);
      if(!a){a=[];grid.set(k,a);}
      a.push(ti);
    }
  });
  return{tris,grid,cell,minX,minY,maxX,maxY};
}

// Retorna {z, modo} — 'exato' = interpolação baricêntrica dentro de um
// triângulo; 'vizinho' = vértice mais próximo dentro do limiar; null = fora
// da cobertura útil. O modo alimenta o diagnóstico de cobertura do TIN.
function zFromTinEx(idx,lng,lat,maxGap){
  if(_MODO_COTA==='prop'){
    const zp=zProporcional(_INTERP,lng,lat);
    if(zp!==null&&isFinite(zp)) return{z:zp,modo:'proporcao'};
  }
  if(!idx) return{z:null,modo:null};
  const{tris,grid,cell,minX,minY}=idx;
  const i=Math.floor((lng-minX)/cell),j=Math.floor((lat-minY)/cell);
  const cand=grid.get(i+':'+j);
  if(cand){
    for(const ti of cand){
      const t=tris[ti];
      const det=(t.by-t.cy)*(t.ax-t.cx)+(t.cx-t.bx)*(t.ay-t.cy);
      if(Math.abs(det)<1e-14) continue;
      const w1=((t.by-t.cy)*(lng-t.cx)+(t.cx-t.bx)*(lat-t.cy))/det;
      const w2=((t.cy-t.ay)*(lng-t.cx)+(t.ax-t.cx)*(lat-t.cy))/det;
      const w3=1-w1-w2;
      if(w1>=-1e-3&&w2>=-1e-3&&w3>=-1e-3) return{z:w1*t.az+w2*t.bz+w3*t.cz,modo:'exato'};
    }
  }
  // Fora de qualquer triângulo — típico da faixa entre curvas quase paralelas,
  // onde o maxEdge apagou os triângulos de ligação. Aqui entra a proporção
  // pela distância às duas curvas mais próximas, em vez do vizinho em degraus.
  const zp=zProporcional(_INTERP,lng,lat);
  if(zp!==null&&isFinite(zp)) return{z:zp,modo:'proporcao'};
  const R=Math.max(1,Math.ceil(maxGap/cell));
  let bestZ=null,bestD=Infinity;
  for(let di=-R;di<=R;di++)for(let dj=-R;dj<=R;dj++){
    const a=grid.get((i+di)+':'+(j+dj));
    if(!a) continue;
    for(const ti of a){
      const t=tris[ti];
      const vs=[[t.ax,t.ay,t.az],[t.bx,t.by,t.bz],[t.cx,t.cy,t.cz]];
      for(const v of vs){
        const d=Math.hypot(lng-v[0],lat-v[1]);
        if(d<bestD){bestD=d;bestZ=v[2];}
      }
    }
  }
  return bestD<=maxGap?{z:bestZ,modo:'vizinho'}:{z:null,modo:null};
}

// Retorna Z interpolado ou null quando fora da cobertura útil do TIN.
function zFromTin(idx,lng,lat,maxGap){
  return zFromTinEx(idx,lng,lat,maxGap).z;
}

// ══════════════════════════════════════════════════════════════
//  Interpolação proporcional entre curvas de nível
//
//  Quando a rua corre QUASE PARALELA às curvas, boa parte dos seus vértices
//  fica na faixa entre duas curvas sem tocar nenhuma. O TIN de Delaunay nem
//  sempre cobre essa faixa: o filtro maxEdge descarta os triângulos longos
//  que ligariam uma curva à outra sempre que o espaçamento entre curvas for
//  grande em relação ao espaçamento AO LONGO delas — exatamente a geometria
//  de curvas paralelas. Sem triângulo, a interpolação baricêntrica falha e o
//  vértice caía no vizinho mais próximo, que é uma função em degraus: todos
//  os pontos da faixa recebiam a cota da curva de baixo.
//
//  Aqui a cota é calculada como o próprio desenho manda: distância até a
//  curva mais próxima (z1, d1) e até a curva mais próxima de cota DIFERENTE
//  (z2, d2), com proporção linear entre as duas.
//
//      z = z1 + (z2 − z1) · d1 / (d1 + d2)
//
//  Sobre a curva → d1 = 0 → z = z1. No meio do vão → 0,5. Não depende de
//  triangulação nenhuma.
// ══════════════════════════════════════════════════════════════
let _INTERP=null;
let _MODO_COTA='auto';   // 'auto' = TIN baricêntrico com proporção no fallback
                         // 'prop' = sempre proporção de distância entre curvas
function criarInterpolador(cPts){
  if(!cPts||!cPts.length) return null;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of cPts){
    if(p.lng<minX)minX=p.lng; if(p.lng>maxX)maxX=p.lng;
    if(p.lat<minY)minY=p.lat; if(p.lat>maxY)maxY=p.lat;
  }
  const cell=Math.max((maxX-minX)/120,(maxY-minY)/120,2e-6);
  const grid=new Map();
  cPts.forEach((p,i)=>{
    const k=Math.floor((p.lng-minX)/cell)+':'+Math.floor((p.lat-minY)/cell);
    let a=grid.get(k);
    if(!a){a=[];grid.set(k,a);}
    a.push(i);
  });
  const cotas=new Set(cPts.map(p=>p.z));
  return{pts:cPts,grid,cell,minX,minY,maxX,maxY,ncotas:cotas.size};
}
function zProporcional(ip,lng,lat){
  if(!ip) return null;
  const{pts,grid,cell,minX,minY,maxX,maxY}=ip;
  const i0=Math.floor((lng-minX)/cell),j0=Math.floor((lat-minY)/cell);
  // O raio precisa cobrir a extensão dos dados MAIS a distância do ponto até
  // eles — senão um ponto afastado nunca alcança a grade e volta null.
  const foraX=Math.max(0,minX-lng,lng-maxX);
  const foraY=Math.max(0,minY-lat,lat-maxY);
  const alcance=Math.max(maxX-minX,maxY-minY)+Math.max(foraX,foraY);
  const Rmax=Math.min(3000,Math.ceil(alcance/cell)+2);
  const porCota=new Map();          // cota → menor distância encontrada
  const visitar=(ci,cj)=>{
    const a=grid.get(ci+':'+cj);
    if(!a) return;
    for(const k of a){
      const p=pts[k];
      const d=Math.hypot(lng-p.lng,lat-p.lat);
      const cur=porCota.get(p.z);
      if(cur===undefined||d<cur) porCota.set(p.z,d);
    }
  };
  // percorre só o perímetro do anel — O(R) em vez de O(R²)
  const varrer=(R)=>{
    if(R===0){visitar(i0,j0);return;}
    for(let d=-R;d<=R;d++){visitar(i0+d,j0-R);visitar(i0+d,j0+R);}
    for(let d=-R+1;d<=R-1;d++){visitar(i0-R,j0+d);visitar(i0+R,j0+d);}
  };
  for(let R=0;R<=Rmax;R++){
    varrer(R);
    if(porCota.size>=2){
      const arr=[...porCota.entries()].sort((a,b)=>a[1]-b[1]);
      // só conclui quando o anel varrido já garante que não há nada mais
      // próximo lá fora — senão a segunda cota poderia estar errada
      if(arr[1][1]<=R*cell){
        const[z1,d1]=arr[0],[z2,d2]=arr[1];
        const s=d1+d2;
        return s<=0?z1:z1+(z2-z1)*(d1/s);
      }
    }
  }
  if(!porCota.size) return null;
  const arr=[...porCota.entries()].sort((a,b)=>a[1]-b[1]);
  if(arr.length===1) return arr[0][0];
  const[z1,d1]=arr[0],[z2,d2]=arr[1];
  const s=d1+d2;
  return s<=0?z1:z1+(z2-z1)*(d1/s);
}

// Réplica fiel do getZFromTIN do app de referência.
// Duas diferenças que importam em relação ao zFromTin usado no drape:
//   1. NUNCA devolve null — se o ponto cair fora de todos os triângulos, usa
//      o vértice mais próximo do TIN sem nenhum limite de distância;
//   2. clampa em zero (Math.max(0, ...)), como a referência.
// É a função usada na etapa de PATCH, onde devolver null viraria cota 0 e
// derrubaria o triângulo para o chão.
function getZFromTIN(idx,lng,lat){
  if(_MODO_COTA==='prop'){
    const zp=zProporcional(_INTERP,lng,lat);
    if(zp!==null&&isFinite(zp)) return Math.max(0,zp);
  }
  if(!idx) return 0;
  const{tris,grid,cell,minX,minY}=idx;
  const i=Math.floor((lng-minX)/cell),j=Math.floor((lat-minY)/cell);
  const cand=grid.get(i+':'+j);
  if(cand){
    for(const ti of cand){
      const t=tris[ti];
      const det=(t.by-t.cy)*(t.ax-t.cx)+(t.cx-t.bx)*(t.ay-t.cy);
      if(Math.abs(det)<1e-14) continue;
      const w1=((t.by-t.cy)*(lng-t.cx)+(t.cx-t.bx)*(lat-t.cy))/det;
      const w2=((t.cy-t.ay)*(lng-t.cx)+(t.ax-t.cx)*(lat-t.cy))/det;
      const w3=1-w1-w2;
      if(w1>=-1e-3&&w2>=-1e-3&&w3>=-1e-3)
        return Math.max(0,w1*t.az+w2*t.bz+w3*t.cz);
    }
  }
  // Fora de qualquer triângulo: proporção pela distância às curvas.
  const zp=zProporcional(_INTERP,lng,lat);
  if(zp!==null&&isFinite(zp)) return Math.max(0,zp);
  // Último recurso: vértice mais próximo do TIN (comportamento da referência).
  let bestZ=0,bestD=Infinity;
  for(const t of tris){
    const vs=[[t.ax,t.ay,t.az],[t.bx,t.by,t.bz],[t.cx,t.cy,t.cz]];
    for(const v of vs){
      const d=Math.hypot(lng-v[0],lat-v[1]);
      if(d<bestD){bestD=d;bestZ=v[2]||0;}
    }
  }
  return Math.max(0,bestZ);
}

// ══════════════════════════════════════════════════════════════
//  Delaunator (carregamento tardio)
// ══════════════════════════════════════════════════════════════
let _DEL=null;
async function getDelaunator(){
  if(!_DEL) _DEL=(await import('https://esm.sh/delaunator@5.0.0')).default;
  return _DEL;
}

// TIN global sobre todos os pontos cotados das curvas.
async function buildTIN(pts){
  const Delaunator=await getDelaunator();
  if(pts.length<4) throw new Error('Pontos insuficientes para o TIN: '+pts.length);
  const SNAP=5e-6,seen=new Set(),cl=[];
  for(const p of pts){
    const k=Math.round(p.lng/SNAP)+','+Math.round(p.lat/SNAP);
    if(seen.has(k)) continue;
    seen.add(k);cl.push(p);
  }
  if(cl.length<4) throw new Error('Pontos deduplicados insuficientes');
  const d=new Delaunator(cl.flatMap(p=>[p.lng,p.lat]));
  // Limiar adaptativo de aresta (mediana × 7) — remove triângulos esticados.
  const samp=[];
  for(let i=0;i<Math.min(d.triangles.length,1200);i+=3){
    const A=cl[d.triangles[i]],B=cl[d.triangles[i+1]];
    samp.push(Math.hypot(A.lng-B.lng,A.lat-B.lat));
  }
  samp.sort((a,b)=>a-b);
  const maxEdge=Math.max((samp[samp.length>>1]||0.001)*7,3e-4);
  const feats=[];
  for(let i=0;i<d.triangles.length;i+=3){
    const A=cl[d.triangles[i]],B=cl[d.triangles[i+1]],C=cl[d.triangles[i+2]];
    const e=Math.max(
      Math.hypot(A.lng-B.lng,A.lat-B.lat),
      Math.hypot(B.lng-C.lng,B.lat-C.lat),
      Math.hypot(C.lng-A.lng,C.lat-A.lat));
    if(e>maxEdge) continue;
    feats.push({type:'Feature',
      properties:{avgH:(A.z+B.z+C.z)/3,ha:A.z,hb:B.z,hc:C.z},
      geometry:{type:'Polygon',coordinates:[[
        [A.lng,A.lat,A.z],[B.lng,B.lat,B.z],[C.lng,C.lat,C.z],[A.lng,A.lat,A.z]]]}});
  }
  return{type:'FeatureCollection',features:feats};
}

// Drape + triangulação de um polígono contra o TIN global.
// `curvasSeg` = segmentos de curva já cotados, com bbox pré-calculada. Onde o
// contorno da rua/calçada cruza uma curva de nível a altura é CONHECIDA com
// exatidão (é a cota daquela curva). Inserir esses cruzamentos como nós força
// a triangulação a quebrar exatamente ali, em vez de interpolar por cima.
async function drapePolygon(geomFeat,tinIdx,stepDeg,cPts,maxGap,curvasSeg){
  const Delaunator=await getDelaunator();
  if(!geomFeat?.geometry) return[];
  const polys=geomFeat.geometry.type==='Polygon'?[geomFeat.geometry.coordinates]
    :geomFeat.geometry.type==='MultiPolygon'?geomFeat.geometry.coordinates:[];
  const out=[];
  let nCruz=0,nExato=0,nViz=0,nFora=0,nProp=0;
  for(const pc of polys){
    if(!pc.length||!pc[0]||pc[0].length<4) continue;
    const poly2D={type:'Feature',properties:{},
      geometry:{type:'Polygon',coordinates:pc.map(r=>r.map(p=>[p[0],p[1]]))}};
    const SNAP=5e-7,seen=new Set(),pts=[];
    const add=(lng,lat,z)=>{
      const k=Math.round(lng/SNAP)+','+Math.round(lat/SNAP);
      if(seen.has(k)) return false;
      seen.add(k);pts.push([lng,lat,Math.max(0,z)]);return true;   // clamp da referência
    };
    // A0) Cruzamentos contorno × curva de nível — cota exata, inseridos
    //     ANTES do adensamento para terem prioridade na deduplicação.
    if(curvasSeg&&curvasSeg.length){
      for(let ri=0;ri<pc.length;ri++){
        const anel=pc[ri].map(p=>[p[0],p[1]]);
        if(anel.length<2) continue;
        const bbA=bboxDe(anel);
        let rl;
        try{rl=turf.lineString(anel);}catch(_){continue;}
        for(const cv of curvasSeg){
          if(!bboxCruza(bbA,cv.bb)) continue;
          let inter;
          try{inter=turf.lineIntersect(rl,cv.line);}catch(_){continue;}
          for(const ip of inter.features||[]){
            const c=ip.geometry?.coordinates;
            if(!c||!isFinite(c[0])||!isFinite(c[1])) continue;
            if(add(c[0],c[1],cv.cota)) nCruz++;
          }
        }
      }
    }
    // A) Anéis (externo + buracos) adensados, Z pelo TIN
    for(let ri=0;ri<pc.length;ri++){
      const dr=densifyRing(pc[ri],stepDeg);
      for(const c of dr.slice(0,-1)){
        const r=zFromTinEx(tinIdx,c[0],c[1],maxGap);
        if(r.z!==null&&isFinite(r.z)){
          if(r.modo==='exato') nExato++;
          else if(r.modo==='proporcao') nProp++;
          else nViz++;
          add(c[0],c[1],r.z);
        }else nFora++;
      }
    }
    // B) Pontos de curva dentro do polígono — cota exata (fonte de verdade)
    for(const cp of cPts){
      try{
        if(turf.booleanPointInPolygon(turf.point([cp.lng,cp.lat]),poly2D)) add(cp.lng,cp.lat,cp.z);
      }catch(_){}
    }
    if(pts.length<3) continue;
    const d=new Delaunator(pts.flatMap(p=>[p[0],p[1]]));
    for(let i=0;i<d.triangles.length;i+=3){
      const A=pts[d.triangles[i]],B=pts[d.triangles[i+1]],C=pts[d.triangles[i+2]];
      const area=(B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]);
      if(Math.abs(area)<1e-14) continue;
      const cx=(A[0]+B[0]+C[0])/3,cy=(A[1]+B[1]+C[1])/3;
      try{if(!turf.booleanPointInPolygon(turf.point([cx,cy]),poly2D)) continue;}
      catch(_){continue;}
      out.push({type:'Feature',
        properties:{avgH:(A[2]+B[2]+C[2])/3,ha:A[2],hb:B[2],hc:C[2]},
        geometry:{type:'Polygon',coordinates:[[
          [A[0],A[1],A[2]],[B[0],B[1],B[2]],[C[0],C[1],C[2]],[A[0],A[1],A[2]]]]}});
    }
  }
  return{tris:out,nCruz,nExato,nViz,nFora,nProp};
}

// bbox rápida de uma lista de coordenadas + teste de sobreposição
function bboxDe(coords){
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for(const p of coords){
    if(p[0]<a)a=p[0]; if(p[1]<b)b=p[1];
    if(p[0]>c)c=p[0]; if(p[1]>d)d=p[1];
  }
  return[a,b,c,d];
}
function bboxCruza(x,y){
  return!(x[2]<y[0]||y[2]<x[0]||x[3]<y[1]||y[3]<x[1]);
}

// ══════════════════════════════════════════════════════════════
//  Malha única conforme
//
//  Triangular cada uso do solo em separado cria uma junção NÃO CONFORME:
//  na divisa entre Calçada e Rua os dois polígonos descrevem a mesma linha,
//  mas o adensamento de cada anel começa de um vértice diferente, então os
//  nós dos dois lados não coincidem. Cada malha interpola a divisa com
//  segmentos distintos e aparecem degraus e fendas — sempre exatamente no
//  cruzamento entre as camadas, que é onde o gradiente é maior.
//
//  Aqui os pontos de TODOS os contornos entram num único conjunto, a
//  triangulação de Delaunay roda UMA vez e cada triângulo é atribuído a uma
//  camada pelo centróide. Como a malha é uma só, a divisa é compartilhada
//  vértice a vértice: sem fenda, sem sobreposição, e cada triângulo pertence
//  a exatamente um uso do solo.
// ══════════════════════════════════════════════════════════════
function bboxGeom(g){
  const cs=[];
  const walk=(a,d)=>{if(d===0){cs.push(a);return;}for(const x of a)walk(x,d-1);};
  const D={Polygon:2,MultiPolygon:3};
  walk(g.coordinates,D[g.type]??2);
  return bboxDe(cs);
}
async function drapeConforme(finais,chaves,tinIdx,stepDeg,cPts,maxGap,curvasSeg,limite){
  const Delaunator=await getDelaunator();
  const SNAP=5e-7,seen=new Set(),pts=[];
  let nCruz=0,nExato=0,nViz=0,nFora=0,nProp=0;
  const add=(lng,lat,z)=>{
    const k=Math.round(lng/SNAP)+','+Math.round(lat/SNAP);
    if(seen.has(k)) return false;
    seen.add(k);pts.push([lng,lat,Math.max(0,z)]);return true;     // clamp da referência
  };
  // Todos os anéis de todas as camadas, num conjunto só
  const aneis=[];
  for(const k of chaves){
    const g=finais[k];
    if(!g?.geometry) continue;
    const polys=g.geometry.type==='Polygon'?[g.geometry.coordinates]
      :g.geometry.type==='MultiPolygon'?g.geometry.coordinates:[];
    for(const pc of polys)
      for(const r of pc)
        if(r&&r.length>=4) aneis.push(r.map(p=>[Number(p[0]),Number(p[1])]));
  }
  // A0) Cruzamentos anel × curva de nível — cota exata, prioridade máxima
  if(curvasSeg&&curvasSeg.length){
    for(const anel of aneis){
      const bbA=bboxDe(anel);
      let rl;
      try{rl=turf.lineString(anel);}catch(_){continue;}
      for(const cv of curvasSeg){
        if(!bboxCruza(bbA,cv.bb)) continue;
        let inter;
        try{inter=turf.lineIntersect(rl,cv.line);}catch(_){continue;}
        for(const ip of inter.features||[]){
          const c=ip.geometry?.coordinates;
          if(c&&isFinite(c[0])&&isFinite(c[1])&&add(c[0],c[1],cv.cota)) nCruz++;
        }
      }
    }
  }
  // A) Anéis adensados
  for(const anel of aneis){
    for(const c of densifyRing(anel,stepDeg).slice(0,-1)){
      const r=zFromTinEx(tinIdx,c[0],c[1],maxGap);
      if(r.z!==null&&isFinite(r.z)){
        if(r.modo==='exato') nExato++;
        else if(r.modo==='proporcao') nProp++;
        else nViz++;
        add(c[0],c[1],r.z);
      }else nFora++;
    }
  }
  // B) Pontos de curva dentro do limite — cota exata
  for(const cp of cPts){
    try{
      if(turf.booleanPointInPolygon(turf.point([cp.lng,cp.lat]),limite)) add(cp.lng,cp.lat,cp.z);
    }catch(_){}
  }
  const res={};
  for(const k of chaves) res[k]={type:'FeatureCollection',features:[]};
  if(pts.length<3) return{res,nCruz,nExato,nViz,nFora,nProp,npts:pts.length};

  const bbs={};
  for(const k of chaves){
    try{bbs[k]=finais[k]?.geometry?bboxGeom(finais[k].geometry):null;}catch(_){bbs[k]=null;}
  }
  const d=new Delaunator(pts.flatMap(p=>[p[0],p[1]]));
  for(let i=0;i<d.triangles.length;i+=3){
    const A=pts[d.triangles[i]],B=pts[d.triangles[i+1]],C=pts[d.triangles[i+2]];
    const area=(B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]);
    if(Math.abs(area)<1e-14) continue;
    const cx=(A[0]+B[0]+C[0])/3,cy=(A[1]+B[1]+C[1])/3;
    let dest=null;
    for(const k of chaves){
      const bb=bbs[k];
      if(bb&&(cx<bb[0]||cx>bb[2]||cy<bb[1]||cy>bb[3])) continue;
      try{
        if(turf.booleanPointInPolygon(turf.point([cx,cy]),finais[k])){dest=k;break;}
      }catch(_){}
    }
    if(!dest) continue;
    res[dest].features.push({type:'Feature',
      properties:{avgH:(A[2]+B[2]+C[2])/3,ha:A[2],hb:B[2],hc:C[2]},
      geometry:{type:'Polygon',coordinates:[[
        [A[0],A[1],A[2]],[B[0],B[1],B[2]],[C[0],C[1],C[2]],[A[0],A[1],A[2]]]]}});
  }
  return{res,nCruz,nExato,nViz,nFora,nProp,npts:pts.length};
}


function hexToRGB(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');
  if(!m) return[0.6,0.6,0.6];
  const n=parseInt(m[1],16);
  const s=v=>{const c=v/255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
  return[s((n>>16)&255),s((n>>8)&255),s(n&255)];
}

function buildGLB(layers,origin){
  const[olng,olat]=origin;
  const mLng=M_PER_DEG_LAT*Math.cos(olat*DEG);
  const bufferViews=[],accessors=[],materials=[],primitives=[],bins=[];
  let byteOffset=0;
  const pushBin=(typed,target)=>{
    const bytes=new Uint8Array(typed.buffer,typed.byteOffset,typed.byteLength);
    const pad=(4-(bytes.byteLength%4))%4;
    bufferViews.push({buffer:0,byteOffset,byteLength:bytes.byteLength,target});
    bins.push(bytes);
    if(pad) bins.push(new Uint8Array(pad));
    byteOffset+=bytes.byteLength+pad;
    return bufferViews.length-1;
  };
  for(const L of layers){
    const pos=[],idx=[];
    let vi=0;
    for(const f of L.features||[]){
      const r=f?.geometry?.coordinates?.[0];
      if(!r||r.length<3) continue;
      for(let i=0;i<3;i++){
        const c=r[i];
        pos.push((c[0]-olng)*mLng,(c[2]||0),-(c[1]-olat)*M_PER_DEG_LAT);
      }
      idx.push(vi,vi+1,vi+2);vi+=3;
    }
    if(!pos.length) continue;
    const pa=new Float32Array(pos),ia=new Uint32Array(idx);
    let mn=[Infinity,Infinity,Infinity],mx=[-Infinity,-Infinity,-Infinity];
    for(let i=0;i<pa.length;i+=3)for(let k=0;k<3;k++){
      const v=pa[i+k];
      if(v<mn[k])mn[k]=v;
      if(v>mx[k])mx[k]=v;
    }
    const bvP=pushBin(pa,34962),bvI=pushBin(ia,34963);
    accessors.push({bufferView:bvP,componentType:5126,count:pa.length/3,type:'VEC3',min:mn,max:mx});
    const accP=accessors.length-1;
    accessors.push({bufferView:bvI,componentType:5125,count:ia.length,type:'SCALAR'});
    const accI=accessors.length-1;
    const rgb=hexToRGB(L.cor);
    materials.push({name:L.name,doubleSided:true,
      pbrMetallicRoughness:{baseColorFactor:[rgb[0],rgb[1],rgb[2],1],metallicFactor:0,roughnessFactor:0.92}});
    primitives.push({attributes:{POSITION:accP},indices:accI,material:materials.length-1,mode:4});
  }
  if(!primitives.length) throw new Error('Nenhum triângulo para exportar');
  const json={
    asset:{version:'2.0',generator:'KV Terreno Guiado '+VERSION},
    scene:0,scenes:[{nodes:[0]}],
    nodes:[{mesh:0,name:'KV_Terreno'}],
    meshes:[{name:'TIN_Uso_do_Solo',primitives}],
    materials,accessors,bufferViews,
    buffers:[{byteLength:byteOffset}],
  };
  const enc=new TextEncoder().encode(JSON.stringify(json));
  const jPad=(4-(enc.byteLength%4))%4;
  const jLen=enc.byteLength+jPad;
  const total=12+8+jLen+8+byteOffset;
  const out=new Uint8Array(total);
  const dv=new DataView(out.buffer);
  let o=0;
  dv.setUint32(o,0x46546C67,true);o+=4;   // 'glTF'
  dv.setUint32(o,2,true);o+=4;
  dv.setUint32(o,total,true);o+=4;
  dv.setUint32(o,jLen,true);o+=4;
  dv.setUint32(o,0x4E4F534A,true);o+=4;   // 'JSON'
  out.set(enc,o);o+=enc.byteLength;
  for(let i=0;i<jPad;i++) out[o++]=0x20;
  dv.setUint32(o,byteOffset,true);o+=4;
  dv.setUint32(o,0x004E4942,true);o+=4;   // 'BIN'
  for(const b of bins){out.set(b,o);o+=b.byteLength;}
  return out;
}

function saveBlob(data,name,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}

// ══════════════════════════════════════════════════════════════
//  App
// ══════════════════════════════════════════════════════════════
function App(){
  // Tema
  const[dark,setDark]=useState(()=>{
    const s=localStorage.getItem('kv_terreno_tema');
    if(s) return s==='dark';
    return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  });
  useEffect(()=>{
    document.documentElement.className=dark?'dark':'light';
    localStorage.setItem('kv_terreno_tema',dark?'dark':'light');
  },[dark]);
  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq=window.matchMedia('(prefers-color-scheme: dark)');
    const fn=e=>{if(!localStorage.getItem('kv_terreno_tema')) setDark(e.matches);};
    try{mq.addEventListener('change',fn);}catch(_){}
    return()=>{try{mq.removeEventListener('change',fn);}catch(_){}};
  },[]);

  const[tab,setTab]=useState(0);
  const[logs,setLogs]=useState([]);
  const[busy,setBusy]=useState('');
  const[pct,setPct]=useState(0);
  const logEl=useRef(null);
  const lg=useCallback((t,m)=>{
    const ts=new Date().toLocaleTimeString('pt-BR',{hour12:false});
    setLogs(p=>[...p,{t,m:String(m),ts}].slice(-400));
  },[]);
  useEffect(()=>{if(logEl.current) logEl.current.scrollTop=logEl.current.scrollHeight;},[logs]);

  // ── Etapa 1: linha de corte ──────────────────────────────────
  // Em Giraffe a ferramenta "polilinha" fecha um polígono; a geometria
  // correta para a guia é a LINHA (LineString). O caminho principal é o
  // usuário desenhar a linha com a ferramenta nativa e selecioná-la aqui.
  const[cap,setCap]=useState(false);
  const capRef=useRef(false);
  useEffect(()=>{capRef.current=cap;},[cap]);
  const[capEv,setCapEv]=useState(0);           // eventos mapSelectCoord recebidos
  const[guia,setGuia]=useState([]);            // [[lng,lat],...]
  const[guiaSrc,setGuiaSrc]=useState('');      // origem da guia (diagnóstico)
  const[avancado,setAvancado]=useState(false);
  const[hits,setHits]=useState([]);            // curvas interceptadas ordenadas
  const[datum,setDatum]=useState(0);
  const[passo,setPasso]=useState(1);
  const[inverter,setInverter]=useState(false);
  const[tolProp,setTolProp]=useState(1.0);     // tolerância de continuidade (m)
  const[aplicado,setAplicado]=useState(false);
  const lastSelRef=useRef([]);
  const linhasRef=useRef([]);                  // todas as linhas do desenho

  // Extrai uma sequência de coordenadas de uma lista de feições.
  // Aceita LineString, MultiLineString e — com aviso — o anel externo de
  // um Polygon (caso o usuário tenha usado a ferramenta polilinha fechada).
  const coordsDeFeicoes=(list)=>{
    const fs=(list||[]).filter(f=>f&&f.geometry);
    const ln=fs.find(f=>['LineString','MultiLineString'].includes(f.geometry.type));
    if(ln){
      const parts=linhasOf(ln.geometry);
      const cs=parts.flat().map(c=>[Number(c[0]),Number(c[1])]);
      return{coords:cs,tipo:ln.geometry.type,fechado:false};
    }
    const pg=fs.find(isPoly);
    if(pg){
      const ring=pg.geometry.type==='Polygon'
        ?pg.geometry.coordinates[0]
        :pg.geometry.coordinates[0][0];
      return{coords:(ring||[]).map(c=>[Number(c[0]),Number(c[1])]),
        tipo:pg.geometry.type,fechado:true};
    }
    return null;
  };

  const aceitarGuia=(r,origem)=>{
    if(!r||!r.coords||r.coords.length<2) throw new Error('Geometria sem vértices suficientes');
    const cs=r.coords.filter(c=>isFinite(c[0])&&isFinite(c[1]));
    if(cs.length<2) throw new Error('Coordenadas inválidas');
    if(r.fechado) lg('warn','Selecionado um POLÍGONO — usando o anel externo como linha. Prefira a ferramenta Linha do Giraffe.');
    setGuia(cs);setGuiaSrc(origem);setHits([]);setAplicado(false);setCap(false);
    let comp=0;
    try{comp=turf.length(turf.lineString(cs),{units:'meters'});}catch(_){}
    lg('ok','Linha de corte definida ('+origem+'): '+cs.length+' vértices · '+comp.toFixed(1)+' m');
  };

  // A) Escolher a linha clicando nela no mapa — caminho principal
  const pickLinha=async()=>{
    setBusy('pick-linha');
    lg('info','Clique sobre a linha de corte no mapa...');
    try{
      const ss=await rpc.invoke('pickRawSections',[]);
      if(!ss?.length) throw new Error('Nada selecionado');
      const r=coordsDeFeicoes(ss);
      if(!r) throw new Error('O elemento escolhido não é uma linha nem um polígono');
      aceitarGuia(r,'pickRawSections');
    }catch(e){lg('err','Seleção da linha: '+e.message);}
    finally{setBusy('');}
  };

  // B) Usar o que já está selecionado no Giraffe
  const usarSelecao=async()=>{
    setBusy('sel-linha');
    try{
      let ss=[];
      try{ss=await rpc.invoke('getSelectedFeatures',[]);}catch(_){}
      if(!ss?.length){
        try{ss=normSections(giraffeState.get('selectedFeatures'));}catch(_){}
      }
      if(!ss?.length) ss=lastSelRef.current||[];
      if(!ss?.length) throw new Error('Nenhuma feição selecionada no Giraffe');
      const r=coordsDeFeicoes(ss);
      if(!r) throw new Error('A seleção atual não contém linha nem polígono');
      aceitarGuia(r,'seleção atual');
    }catch(e){lg('err','Seleção atual: '+e.message);}
    finally{setBusy('');}
  };

  // Sonda a seleção enquanto a aba Guia está aberta (selectedFeatures
  // costuma vir vazio no instante do clique — guardamos o último válido).
  useEffect(()=>{
    if(tab!==0) return;
    let vivo=true;
    const id=setInterval(async()=>{
      if(!vivo) return;
      let ss=null;
      try{ss=await rpc.invoke('getSelectedFeatures',[]);}catch(_){}
      if(!ss?.length){try{ss=normSections(giraffeState.get('selectedFeatures'));}catch(_){}}
      if(ss?.length) lastSelRef.current=ss;
    },400);
    return()=>{vivo=false;clearInterval(id);};
  },[tab]);

  // C) Ativar a ferramenta Linha nativa do Giraffe
  const ativarFerramentaLinha=async()=>{
    setBusy('tool');
    try{
      await rpc.invoke('setDrawTool',['line']);
      lg('ok','setDrawTool("line") enviado. Se a barra do Giraffe não mudar, ative a ferramenta Linha manualmente.');
    }catch(e){
      lg('warn','setDrawTool indisponível ('+e.message+'). Use a ferramenta Linha na barra do Giraffe.');
    }finally{setBusy('');}
  };

  // D) Listener de clique no mapa — modo avançado, pode não disparar
  //    dependendo da versão/host do Giraffe. O contador serve de diagnóstico.
  useEffect(()=>{
    const handler=()=>{
      if(!capRef.current) return;
      let c=null;
      try{c=giraffeState.get('mapSelectCoord');}catch(_){return;}
      if(!Array.isArray(c)||c.length<2) return;
      const p=[Number(c[0]),Number(c[1])];
      if(!isFinite(p[0])||!isFinite(p[1])) return;
      setCapEv(n=>n+1);
      setGuia(prev=>{
        const last=prev[prev.length-1];
        if(last&&Math.abs(last[0]-p[0])<1e-10&&Math.abs(last[1]-p[1])<1e-10) return prev;
        return[...prev,p];
      });
      setGuiaSrc('cliques no mapa');
    };
    try{giraffeState.addListener(['mapSelectCoord'],handler);}
    catch(e){lg('warn','mapSelectCoord indisponível: '+e.message);}
    return()=>{try{giraffeState.removeListener&&giraffeState.removeListener(['mapSelectCoord'],handler);}catch(_){}};
  },[lg]);

  // Preview da guia no mapa
  useEffect(()=>{
    (async()=>{
      try{await rpc.invoke('removeTempLayer',[GUIDE_ID]);}catch(_){}
      try{await rpc.invoke('removeTempLayer',[GUIDE_PTS_ID]);}catch(_){}
      if(guia.length<1) return;
      const ptsFC={type:'FeatureCollection',features:guia.map((c,i)=>({
        type:'Feature',properties:{n:i+1},geometry:{type:'Point',coordinates:c}}))};
      try{
        await rpc.invoke('addTempLayerGeoJSON',[GUIDE_PTS_ID,ptsFC,
          {type:'circle',paint:{'circle-radius':5,'circle-color':'#00ACCD',
            'circle-stroke-width':1.5,'circle-stroke-color':'#ffffff'}}]);
      }catch(_){}
      if(guia.length<2) return;
      const fc={type:'FeatureCollection',features:[
        {type:'Feature',properties:{},geometry:{type:'LineString',coordinates:guia}}]};
      try{
        await rpc.invoke('addTempLayerGeoJSON',[GUIDE_ID,fc,
          {type:'line',paint:{'line-color':'#00ACCD','line-width':2.5,'line-dasharray':[2,1.5]}}]);
      }catch(_){}
    })();
  },[guia]);

  const addPontoDraw=async()=>{
    try{
      const r=await rpc.invoke('drawPoint',[]);
      let c=null;
      if(Array.isArray(r)&&r.length>=2) c=[Number(r[0]),Number(r[1])];
      else if(r?.geometry?.coordinates) c=[Number(r.geometry.coordinates[0]),Number(r.geometry.coordinates[1])];
      else if(r&&isFinite(r.lng)&&isFinite(r.lat)) c=[Number(r.lng),Number(r.lat)];
      if(!c||!isFinite(c[0])||!isFinite(c[1])) throw new Error('Retorno inválido de drawPoint');
      setGuia(p=>[...p,c]);setGuiaSrc('drawPoint');
      lg('ok','Ponto '+(guia.length+1)+': '+c[0].toFixed(6)+', '+c[1].toFixed(6));
    }catch(e){lg('err','drawPoint: '+e.message);}
  };

  // Detecção de curvas interceptadas
  const doDetectar=async()=>{
    if(guia.length<2){lg('err','A linha de corte precisa de ao menos 2 vértices.');return;}
    setBusy('detect');setPct(0);
    try{
      let rs=[];
      try{rs=normSections(giraffeState.get('rawSections'));}catch(_){}
      if(!rs.length){
        try{rs=normSections(await rpc.invoke('getRawSections',[]));}catch(_){}
      }
      lg('info',rs.length+' feições lidas do desenho.');
      const linhas=rs.filter(f=>['LineString','MultiLineString'].includes(f?.geometry?.type));
      if(!linhas.length) throw new Error('Nenhuma linha no desenho do Giraffe.');
      linhasRef.current=linhas;
      lg('info',linhas.length+' linhas candidatas a curva de nível.');
      const guiaLine=turf.lineString(guia);
      const p0=turf.point(guia[0]);
      const achados=[];
      for(let i=0;i<linhas.length;i++){
        const f=linhas[i];
        let melhor=Infinity,n=0;
        for(const part of linhasOf(f.geometry)){
          if(!part||part.length<2) continue;
          let cl;
          try{cl=turf.lineString(part.map(c=>[c[0],c[1]]));}catch(_){continue;}
          let inter;
          try{inter=turf.lineIntersect(guiaLine,cl);}catch(_){continue;}
          for(const ip of inter.features||[]){
            n++;
            let d;
            try{d=turf.length(turf.lineSlice(p0,ip,guiaLine),{units:'meters'});}
            catch(_){d=turf.distance(p0,ip,{units:'meters'});}
            if(d<melhor) melhor=d;
          }
        }
        if(n>0&&isFinite(melhor)) achados.push({id:fid(f),dist:melhor,nInter:n,feat:f});
        setPct(Math.round((i+1)/linhas.length*100));
      }
      if(!achados.length) throw new Error('A linha de corte não interceptou nenhuma curva.');
      achados.sort((a,b)=>a.dist-b.dist);
      if(inverter) achados.reverse();
      const lista=achados.map((a,i)=>({...a,ord:i+1,cota:Number((datum+i*passo).toFixed(3))}));
      // Propaga as cotas para os trechos de curva que a guia não atravessou.
      // Sem isso o TIN nasce cheio de buracos e a interpolação vira ruído.
      const pr=propagarCotas(lista,linhas,tolProp);
      const total=[...lista,...pr.novos];
      setHits(total);setAplicado(false);
      const semId=total.filter(x=>!x.id).length;
      lg('ok',lista.length+' curvas interceptadas · cotas '+lista[0].cota+' → '+lista[lista.length-1].cota+' m');
      if(pr.novos.length) lg('ok','+'+pr.novos.length+' trechos herdaram cota por continuidade (tolerância '+tolProp+' m, '+pr.iter+' passadas).');
      if(pr.restantes) lg('warn',pr.restantes+' linha(s) do desenho continuam SEM cota e ficarão de fora do TIN. Aumente a tolerância ou estenda a linha de corte.');
      if(semId) lg('warn',semId+' curva(s) sem id — não poderão ser atualizadas no Giraffe.');
    }catch(e){lg('err','Detecção: '+e.message);}
    finally{setBusy('');setPct(0);}
  };

  // Recalcula cotas quando datum/passo/inverter mudam
  const recotar=(d,p,inv)=>{
    setHits(prev=>{
      const base=prev.filter(x=>!x.herdada).sort((a,b)=>a.dist-b.dist);
      if(!base.length) return prev;
      const seq=inv?[...base].reverse():base;
      const lista=seq.map((x,i)=>({...x,ord:i+1,cota:Number((d+i*p).toFixed(3))}));
      const pr=propagarCotas(lista,linhasRef.current||[],tolProp);
      return[...lista,...pr.novos];
    });
    setAplicado(false);
  };

  const setCota=(ord,v)=>{
    setHits(prev=>{
      const base=prev.filter(x=>!x.herdada)
        .map(x=>x.ord===ord?{...x,cota:v===''?0:Number(v)}:x);
      const pr=propagarCotas(base,linhasRef.current||[],tolProp);
      return[...base,...pr.novos];
    });
    setAplicado(false);
  };

  // Repropaga manualmente com a tolerância atual
  const doPropagar=()=>{
    const base=hits.filter(x=>!x.herdada);
    if(!base.length){lg('err','Detecte as curvas interceptadas primeiro.');return;}
    const pr=propagarCotas(base,linhasRef.current||[],tolProp);
    setHits([...base,...pr.novos]);setAplicado(false);
    lg(pr.novos.length?'ok':'warn',pr.novos.length+' trecho(s) herdaram cota (tolerância '
      +tolProp+' m) · '+pr.restantes+' ainda sem cota.');
  };

  // Aplica elevação via updateRawSections
  const doAplicar=async()=>{
    const validos=hits.filter(x=>x.id);
    if(!validos.length){lg('err','Nenhuma curva com id para atualizar.');return;}
    setBusy('aplicar');setPct(0);
    try{
      const updates=validos.map(x=>({
        properties:{
          id:x.id,
          baseHeight:x.cota,
          _baseHeight:x.cota,
          height:0,
          kv_cota:x.cota,
          kv_ordem:x.ord,
        }
      }));
      lg('info','Enviando '+updates.length+' atualizações via updateRawSections...');
      await rpc.invoke('updateRawSections',[updates]);
      setPct(100);setAplicado(true);
      lg('ok','✓ '+updates.length+' curvas reposicionadas em 3D (baseHeight / _baseHeight).');
      await previewCurvas(hits);
    }catch(e){lg('err','updateRawSections: '+e.message);}
    finally{setBusy('');}
  };

  const previewCurvas=async(lista)=>{
    try{await rpc.invoke('removeTempLayer',[CURVAS_ID]);}catch(_){}
    const feats=[];
    for(const it of lista){
      for(const part of linhasOf(it.feat.geometry)){
        feats.push({type:'Feature',
          properties:{cota:it.cota,baseHeight:it.cota,_baseHeight:it.cota,height:0},
          geometry:{type:'LineString',coordinates:part.map(c=>[c[0],c[1],it.cota])}});
      }
    }
    if(!feats.length) return;
    const cotas=lista.map(x=>x.cota);
    const mn=Math.min(...cotas),mx=Math.max(...cotas)||1;
    try{
      await rpc.invoke('addTempLayerGeoJSON',[CURVAS_ID,{type:'FeatureCollection',features:feats},
        {type:'line',paint:{
          'line-color':['interpolate',['linear'],['get','cota'],mn,'#2FAF83',(mn+mx)/2,'#00ACCD',mx,'#F0A030'],
          'line-width':1.8,'line-opacity':0.95}}]);
    }catch(e){lg('warn','Preview de curvas: '+e.message);}
  };

  const limparGuia=async()=>{
    setGuia([]);setHits([]);setAplicado(false);setCap(false);setGuiaSrc('');setCapEv(0);
    try{await rpc.invoke('removeTempLayer',[GUIDE_ID]);}catch(_){}
    try{await rpc.invoke('removeTempLayer',[GUIDE_PTS_ID]);}catch(_){}
    lg('info','Linha de corte descartada.');
  };

  // ── Etapa 2: perímetros por uso do solo ──────────────────────
  const[perims,setPerims]=useState({terreno:[],area:[],calcada:[],rua:[]});
  const[exclusivo,setExclusivo]=useState(true);
  const[conforme,setConforme]=useState(false); // malha única × malhas separadas (referência)
  const[modoCota,setModoCota]=useState('auto');// método de cota entre curvas
  const[margem,setMargem]=useState(25);        // buffer de suporte do TIN (m)
  const[dens,setDens]=useState(2);             // 1 Normal · 2 Alta · 3 Máxima
  const[tins,setTins]=useState(null);
  const[vis,setVis]=useState({terreno:true,area:true,calcada:true,rua:true});
  const[stats,setStats]=useState(null);
  const tinGlobalRef=useRef(null);   // índice do TIN global — base do patch 3D

  const pickPerim=async(k)=>{
    setBusy('pick-'+k);
    const lb=(USOS.find(x=>x.k===k)||{}).lb;
    lg('info',lb+': clique nos elementos no mapa (linhas fechadas ou polígonos).');
    try{
      const ss=await rpc.invoke('pickRawSections',[]);
      if(!ss?.length) throw new Error('Nada selecionado');
      const novos=feicoesParaPoligonos(ss);
      if(!novos.length){
        const tipos=[...new Set((ss||[]).map(f=>f?.geometry?.type||'?'))].join(', ');
        throw new Error('Nenhum contorno aproveitável na seleção (tipos: '+tipos+')');
      }
      const abertas=novos.filter(n=>n.gap>0.5);
      if(abertas.length) lg('warn',abertas.length+' linha(s) aberta(s) fechada(s) automaticamente (vão de '
        +Math.min(...abertas.map(a=>a.gap)).toFixed(1)+' a '+Math.max(...abertas.map(a=>a.gap)).toFixed(1)+' m).');
      const feats=novos.map(n=>({type:'Feature',properties:{},geometry:n.geom}));
      setPerims(p=>{
        const atual=p[k]||[];
        const todos=[...atual,...feats];
        let a=0;
        try{a=turf.area(unionOf(todos));}catch(_){}
        lg('ok',lb+': +'+feats.length+' → '+todos.length+' contorno(s) · '
          +a.toLocaleString('pt-BR',{maximumFractionDigits:0})+' m²');
        return{...p,[k]:todos};
      });
    }catch(e){lg('err','Seleção '+lb+': '+e.message);}
    finally{setBusy('');}
  };
  const clearPerim=k=>{
    setPerims(p=>({...p,[k]:[]}));
    lg('info',(USOS.find(x=>x.k===k)||{}).lb+': seleção limpa.');
  };

  // Lê cotas já gravadas no desenho (kv_cota / baseHeight)
  const doLerCotas=async()=>{
    setBusy('ler');
    try{
      let rs=[];
      try{rs=normSections(giraffeState.get('rawSections'));}catch(_){}
      if(!rs.length){try{rs=normSections(await rpc.invoke('getRawSections',[]));}catch(_){}}
      const lista=[];
      for(const f of rs){
        if(!['LineString','MultiLineString'].includes(f?.geometry?.type)) continue;
        const p=f.properties||{};
        const v=p.kv_cota??p.baseHeight??p._baseHeight;
        const c=Number(v);
        if(v===undefined||v===null||!isFinite(c)) continue;
        lista.push({id:fid(f),dist:0,nInter:0,feat:f,ord:lista.length+1,cota:c});
      }
      if(!lista.length) throw new Error('Nenhuma curva com cota (kv_cota / baseHeight) no desenho.');
      const todasLn=rs.filter(f=>['LineString','MultiLineString'].includes(f?.geometry?.type));
      linhasRef.current=todasLn;
      const pr=propagarCotas(lista,todasLn,tolProp);
      setHits([...lista,...pr.novos]);setAplicado(true);
      const cs=lista.map(x=>x.cota);
      lg('ok',lista.length+' curvas cotadas lidas do desenho · '+Math.min(...cs)+' → '+Math.max(...cs)+' m');
      if(pr.novos.length) lg('ok','+'+pr.novos.length+' trechos herdaram cota por continuidade.');
      if(pr.restantes) lg('warn',pr.restantes+' linha(s) sem cota ficarão de fora do TIN.');
    }catch(e){lg('err','Leitura de cotas: '+e.message);}
    finally{setBusy('');}
  };

  // ── Etapa 3: TIN por uso do solo ─────────────────────────────
  const doTIN=async()=>{
    if(!hits.length){lg('err','Não há curvas cotadas. Faça a Etapa 1 ou leia as cotas do desenho.');return;}
    const ativos=USOS.filter(u=>perims[u.k]?.length);
    if(!ativos.length){lg('err','Selecione ao menos um perímetro na aba Perímetros.');return;}
    setBusy('tin');setPct(0);setStats(null);
    try{
      // 1. LIMITE MESTRE — a Área Total contém todas as demais camadas.
      //    Tudo é recortado por ela e o TIN nunca extrapola esse contorno.
      let limite=perims.area?.length?unionOf(perims.area):null;
      let semArea=false;
      if(!limite){
        semArea=true;
        limite=unionOf(SUB_USOS.flatMap(k=>perims[k]||[]));
        if(!limite) throw new Error('Defina o perímetro da Área Total.');
        lg('warn','Área Total não definida — usando a união das demais camadas como limite.');
      }
      let aLim=0;
      try{aLim=turf.area(limite);}catch(_){}
      lg('ok','Limite da área: '+aLim.toLocaleString('pt-BR',{maximumFractionDigits:0})+' m²');

      // 2. Pontos cotados das curvas, recortados ao limite + margem de suporte.
      //    A margem garante que os vértices do PERÍMETRO caiam dentro da
      //    cobertura do TIN e recebam Z por interpolação baricêntrica exata,
      //    em vez do fallback de vizinho mais próximo (que distorce a borda).
      const marg=Math.max(0,Number(margem)||0);
      let limBuf=limite;
      if(marg>0){
        try{const b=turf.buffer(limite,marg,{units:'meters'});if(b?.geometry) limBuf=b;}catch(_){}
      }
      const maxPer=dens===1?20:dens===2?60:200;
      const brutos=[];
      for(const it of hits){
        for(const ln of linhasOf(it.feat.geometry)){
          const step=Math.max(1,Math.floor(ln.length/maxPer));
          for(let i=0;i<ln.length;i+=step) brutos.push({lng:ln[i][0],lat:ln[i][1],z:it.cota});
          const last=ln[ln.length-1];
          if(last) brutos.push({lng:last[0],lat:last[1],z:it.cota});
        }
      }
      const cPts=brutos.filter(p=>{
        try{return turf.booleanPointInPolygon([p.lng,p.lat],limBuf);}catch(_){return false;}
      });
      lg('info','Clip ao limite + '+marg+' m de margem: '+brutos.length+' → '+cPts.length+' pontos');
      if(cPts.length<8) throw new Error('Apenas '+cPts.length+' pontos cotados dentro do limite — aumente a margem ou a densidade.');
      const zs=cPts.map(p=>p.z);
      const zMin=Math.min(...zs),zMax=Math.max(...zs);
      lg('ok',cPts.length+' pontos cotados · Z '+zMin+' → '+zMax+' m');
      setPct(15);

      // 3. TIN global (superfície de referência para o drape)
      lg('info','Triangulando TIN global (Delaunay)...');
      const tinG=await buildTIN(cPts);
      if(!tinG.features.length) throw new Error('TIN global sem triângulos válidos');
      lg('ok','TIN global: '+tinG.features.length+' triângulos');
      const idx=buildTinIndex(tinG.features);
      tinGlobalRef.current=idx;
      // Interpolador por proporção — usado sempre que o TIN não cobrir o ponto
      _INTERP=criarInterpolador(cPts);
      _MODO_COTA=modoCota;
      lg('info','Interpolador por proporção pronto: '+(_INTERP?.ncotas||0)+' cotas distintas.');
      setPct(35);

      // 4. Sub-camadas recortadas ao limite e, opcionalmente, entre si
      const clipped={};
      for(const k of SUB_USOS){
        if(!perims[k]?.length) continue;
        const u=unionOf(perims[k]);
        if(!u) continue;
        let g=u;
        try{const it=turf.intersect(limite,u);g=it?.geometry?it:null;}
        catch(e){lg('warn',k+': interseção com o limite falhou — usando polígono original');}
        if(!g){lg('warn',(USOS.find(x=>x.k===k)||{}).lb+': fora do limite da Área Total — ignorada.');continue;}
        clipped[k]=g;
      }
      if(exclusivo){
        const acum=[];
        for(const k of SUB_USOS){
          if(!clipped[k]) continue;
          let g=clipped[k];
          const orig=clipped[k];
          for(const prev of acum){
            if(!g) break;
            // difference retorna null quando o resultado é VAZIO — a camada
            // foi totalmente absorvida pela de prioridade maior e é removida.
            try{const df=turf.difference(g,prev);g=df?.geometry?df:null;}catch(_){}
          }
          if(g) clipped[k]=g;
          else{
            delete clipped[k];
            lg('warn',(USOS.find(x=>x.k===k)||{}).lb+': totalmente coberta por camada de prioridade maior — removida.');
          }
          acum.push(orig);
        }
        const seq=SUB_USOS.filter(k=>clipped[k]).map(k=>(USOS.find(x=>x.k===k)||{}).lb);
        if(seq.length) lg('info','Recorte por prioridade: '+seq.join(' › '));
      }
      // 5. Resíduo do limite = Área Total menos tudo o que já foi coberto
      let resid=limite;
      for(const k of SUB_USOS){
        if(!clipped[k]||!resid) continue;
        try{const df=turf.difference(resid,clipped[k]);resid=df?.geometry?df:null;}catch(_){}
      }
      let aResid=0;
      try{aResid=resid?turf.area(resid):0;}catch(_){}
      const finais={};
      for(const k of SUB_USOS) if(clipped[k]) finais[k]=clipped[k];
      if(!semArea&&resid&&aResid>Math.max(1,aLim*0.001)) finais.area=resid;
      if(!semArea) lg('info','Resíduo da Área Total: '+aResid.toLocaleString('pt-BR',{maximumFractionDigits:0})+' m²');
      const ordem=USOS.filter(u=>finais[u.k]);
      if(!ordem.length) throw new Error('Nenhum polígono válido após o recorte pelo limite.');
      setPct(45);

      // 6. Drape + triangulação separada por uso
      const STEP=2/M_PER_DEG_LAT;   // adensamento ~2 m
      const GAP=6e-4;               // ~67 m de tolerância fora do TIN
      // Segmentos de curva cotados, com bbox pré-calculada, para achar os
      // cruzamentos exatos com os contornos de rua/calçada/terreno.
      const curvasSeg=[];
      for(const it of hits){
        for(const part of linhasOf(it.feat.geometry)){
          const cs=(part||[]).map(c=>[Number(c[0]),Number(c[1])])
            .filter(c=>isFinite(c[0])&&isFinite(c[1]));
          if(cs.length<2) continue;
          let line;
          try{line=turf.lineString(cs);}catch(_){continue;}
          curvasSeg.push({line,bb:bboxDe(cs),cota:it.cota});
        }
      }
      lg('info',curvasSeg.length+' segmentos de curva preparados para cruzamento com os contornos.');
      const res={};
      let cruzTotal=0,exatoAcc=0,bordaAcc=0,propAcc=0,vizAcc=0,foraAcc=0;
      if(conforme){
        lg('info','Malha única conforme — todas as camadas na mesma triangulação...');
        const dc=await drapeConforme(finais,ordem.map(u=>u.k),idx,STEP,cPts,GAP,curvasSeg,limite);
        for(const u of ordem) res[u.k]=dc.res[u.k]||{type:'FeatureCollection',features:[]};
        cruzTotal=dc.nCruz;
        exatoAcc=dc.nExato;propAcc=dc.nProp;vizAcc=dc.nViz;foraAcc=dc.nFora;
        bordaAcc=dc.nExato+dc.nProp+dc.nViz+dc.nFora;
        lg('ok',dc.npts.toLocaleString('pt-BR')+' nós no conjunto único · '+dc.nCruz+' cruzamentos com curvas');
        for(const u of ordem)
          lg(res[u.k].features.length?'ok':'warn','   '+u.lb+': '+res[u.k].features.length+' triângulos');
        setPct(85);
      }else{
        let i=0;
        for(const u of ordem){
          i++;
          lg('info','Drape + TIN · '+u.lb+'...');
          const dr=await drapePolygon(finais[u.k],idx,STEP,cPts,GAP,curvasSeg);
          cruzTotal+=dr.nCruz;
          res[u.k]={type:'FeatureCollection',features:dr.tris};
          exatoAcc+=dr.nExato;propAcc+=dr.nProp;vizAcc+=dr.nViz;foraAcc+=dr.nFora;
          bordaAcc+=dr.nExato+dr.nProp+dr.nViz+dr.nFora;
          lg(dr.tris.length?'ok':'warn',u.lb+': '+dr.tris.length+' triângulos · '+dr.nCruz+' nós de cruzamento');
          setPct(45+Math.round(i/ordem.length*40));
        }
        lg('warn','Malhas independentes: pode haver degrau na divisa entre camadas.');
      }
      if(!cruzTotal) lg('warn','Nenhum cruzamento contorno × curva encontrado — as bordas ficam só com Z interpolado.');
      const pctGlobal=bordaAcc?Math.round(exatoAcc/bordaAcc*100):0;
      lg('info','Vértices de borda: '+exatoAcc+' baricêntricos · '+propAcc+' por proporção entre curvas · '
        +vizAcc+' por vizinho · '+foraAcc+' descartados.');
      if(propAcc>exatoAcc) lg('info','A maioria caiu na faixa entre curvas — resolvida por proporção de distância, não por degrau.');
      const total=Object.values(res).reduce((s,fc)=>s+fc.features.length,0);
      if(!total) throw new Error('Nenhum triângulo gerado — verifique perímetros e curvas.');

      // 5. Preview com cores distintas por uso
      for(const u of USOS){
        try{await rpc.invoke('removeTempLayer',[u.id]);}catch(_){}
      }
      for(const u of ordem){
        const fc=res[u.k];
        if(!fc?.features?.length) continue;
        await rpc.invoke('addTempLayerGeoJSON',[u.id,JSON.parse(JSON.stringify(fc)),{
          type:'fill-extrusion',
          paint:{
            'fill-extrusion-color':u.cor,
            'fill-extrusion-height':['get','avgH'],
            'fill-extrusion-base':0,
            'fill-extrusion-opacity':0.92,
          }}]);
      }
      setTins(res);
      setVis({terreno:true,area:true,calcada:true,rua:true});
      setStats({zMin,zMax,dnivel:Number((zMax-zMin).toFixed(2)),npts:cPts.length,
        ntriG:tinG.features.length,ntri:total,aLim,semArea,ncruz:cruzTotal,
        pctEx:bordaAcc?Math.round((exatoAcc+propAcc)/bordaAcc*100):0,nprop:propAcc,
        nherd:hits.filter(x=>x.herdada).length,ncot:hits.length});
      setPct(100);
      lg('ok','✓ Preview publicado — '+total+' triângulos em '+ordem.length+' camada(s).');
      setTab(2);
    }catch(e){lg('err','TIN: '+e.message);}
    finally{setBusy('');}
  };

  const toggleVis=async(k)=>{
    if(!tins?.[k]) return;
    const nv={...vis,[k]:!vis[k]};
    setVis(nv);
    const u=USOS.find(x=>x.k===k);
    if(!nv[k]){try{await rpc.invoke('removeTempLayer',[u.id]);}catch(_){}return;}
    try{await rpc.invoke('removeTempLayer',[u.id]);}catch(_){}
    await rpc.invoke('addTempLayerGeoJSON',[u.id,JSON.parse(JSON.stringify(tins[k])),{
      type:'fill-extrusion',
      paint:{'fill-extrusion-color':u.cor,'fill-extrusion-height':['get','avgH'],
        'fill-extrusion-base':0,'fill-extrusion-opacity':0.92}}]);
  };

  // ── Fixar camada no Giraffe (importRawSections + patch slab) ──
  const doFixar=async(k)=>{
    const fc=tins?.[k];
    if(!fc?.features?.length){lg('warn','Sem triângulos para fixar.');return;}
    const u=USOS.find(x=>x.k===k);
    setBusy('fix-'+k);setPct(0);
    try{
      const valid=fc.features.filter(f=>{
        const r=f.geometry.coordinates[0];
        if(!r||r.length<4) return false;
        const[a,b,c]=r;
        return[a[0],a[1],b[0],b[1],c[0],c[1]].every(Number.isFinite)
          &&Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))>1e-12;
      });
      if(!valid.length) throw new Error('Sem triângulos válidos');
      const allH=valid.flatMap(f=>f.geometry.coordinates[0].slice(0,3).map(v=>v[2]||0));
      lg('info',u.lb+': '+valid.length+' tri | Z '+Math.min(...allH).toFixed(2)+'–'+Math.max(...allH).toFixed(2)+' m');
      const plain=valid.map(f=>({type:'Feature',geometry:f.geometry,
        properties:{stackOrder:0,layerId:'default',kv_uso:u.lb}}));
      const imported=await rpc.invoke('importRawSections',[plain]);
      if(!Array.isArray(imported)||!imported.length) throw new Error('importRawSections sem retorno');
      lg('ok',u.lb+': '+imported.length+' seções criadas');
      setPct(55);

      // Patch por vértice via TIN global — réplica do doFixarCat da referência.
      // O Z é recalculado a partir das COORDENADAS DEVOLVIDAS pelo Giraffe,
      // com getZFromTIN, que nunca devolve null. A versão anterior tentava
      // casar cada seção importada com o triângulo original pelo índice do
      // array; quando a correspondência falhava o patch saía vazio ou zerado
      // e o triângulo despencava para o chão.
      const gIdx=tinGlobalRef.current;
      if(!gIdx) throw new Error('TIN global ausente — gere o TIN antes de aplicar');
      const updates=[];
      let semGeom=0;
      for(let i=0;i<imported.length;i++){
        const imp=imported[i];
        const id=imp?.properties?.id;
        if(!id) continue;
        const impR=imp?.geometry?.coordinates?.[0];
        let patch;
        if(impR&&impR.length>=3){
          patch=impR.slice(0,3).map(c=>Number(getZFromTIN(gIdx,c[0],c[1]).toFixed(4)));
        }else{
          semGeom++;
          const orig=valid[i]?.geometry?.coordinates?.[0];
          if(!orig||orig.length<3) continue;
          patch=orig.slice(0,3).map(c=>Number(Math.max(0,c[2]||0).toFixed(4)));
        }
        if(patch.length!==3||patch.some(v=>!isFinite(v))) continue;
        updates.push({properties:{id,patch,patchType:'slab'}});
      }
      if(!updates.length) throw new Error('Nenhuma seção importada retornou id e geometria válidos');
      if(semGeom) lg('warn',u.lb+': '+semGeom+' seções voltaram sem geometria — usado o Z do triângulo original.');
      const pAll=updates.flatMap(x=>x.properties.patch);
      const nulos=updates.filter(x=>x.properties.patch.every(v=>v===0)).length;
      lg('info',u.lb+': patch Z '+Math.min(...pAll).toFixed(2)+'–'+Math.max(...pAll).toFixed(2)+' m'
        +(nulos?(' · '+nulos+' triângulos totalmente em zero'):''));
      if(nulos>updates.length*0.1)
        lg('warn',u.lb+': '+Math.round(nulos/updates.length*100)+'% dos triângulos zerados — o TIN não cobre essa área.');
      await rpc.invoke('updateRawSections',[updates]);
      setPct(100);
      lg('ok','✓ '+u.lb+': '+updates.length+' patches slab aplicados.');
    }catch(e){lg('err','Fixar '+u.lb+': '+e.message);}
    finally{setBusy('');}
  };

    lg('info','━━ Aplicando superfície 3D (patch slab) ━━');
    for(const k of ks) await doFixar(k);
    lg('ok','Concluído. O relevo inclinado aparece nas seções do Giraffe, não no preview colorido.');
  };

  // ── Exportação ───────────────────────────────────────────────
  const doGLB=async()=>{
    if(!tins) return;
    setBusy('glb');
    try{
      const layers=USOS.filter(u=>tins[u.k]?.features?.length)
        .map(u=>({name:u.lb,cor:u.cor,features:tins[u.k].features}));
      if(!layers.length) throw new Error('Nenhuma camada com triângulos');
      const all=layers.flatMap(L=>L.features);
      const bb=turf.bbox({type:'FeatureCollection',features:all});
      const origin=[(bb[0]+bb[2])/2,(bb[1]+bb[3])/2];
      const glb=buildGLB(layers,origin);
      saveBlob(glb,'kv-terreno-'+Date.now()+'.glb','model/gltf-binary');
      lg('ok','GLB gerado: '+layers.length+' materiais · '+(glb.byteLength/1024).toFixed(0)+' KB · origem '+origin[0].toFixed(6)+', '+origin[1].toFixed(6));
    }catch(e){lg('err','GLB: '+e.message);}
    finally{setBusy('');}
  };

        lg('ok','Cena 3D exportada (GLTF).');
      }else if(r instanceof Blob){
        saveBlob(r,'giraffe-cena-'+Date.now()+'.glb','model/gltf-binary');
        lg('ok','Cena 3D exportada (GLB).');
      }else if(r instanceof ArrayBuffer||ArrayBuffer.isView(r)){
        saveBlob(new Uint8Array(r.buffer||r),'giraffe-cena-'+Date.now()+'.glb','model/gltf-binary');
        lg('ok','Cena 3D exportada (GLB).');
      }else{
        saveBlob(JSON.stringify(r),'giraffe-cena-'+Date.now()+'.gltf','model/gltf+json');

              h('div',{key:u.k,className:'slot on'},
                h('span',{className:'swatch',style:{backgroundColor:u.cor}}),
                h('div',{style:{flex:1,minWidth:0}},
                  h('div',{className:'slot-name'},u.lb),
                  h('div',{className:'slot-meta'},
                    tins[u.k].features.length.toLocaleString('pt-BR')+' triângulos')),
                h('button',{className:'btn btn-out btn-icon',onClick:()=>toggleVis(u.k),
                  'aria-label':(vis[u.k]?'Ocultar ':'Mostrar ')+u.lb,
                  'aria-pressed':vis[u.k]?'true':'false'},
                  h(Icon,{n:vis[u.k]?'eye':'eyeoff',s:16})),
                h('button',{className:'btn btn-out btn-icon',onClick:()=>doFixar(u.k),
                  disabled:isBusy,'aria-label':'Fixar '+u.lb+' na camada ativa do Giraffe',
                  title:'Fixar no Giraffe'},h(Icon,{n:'pin',s:16}))
              ))),
          h('p',{className:'hint',style:{marginTop:'8px'}},
            'Ative a camada de destino no painel do Giraffe antes de aplicar. O alfinete aplica só aquele uso do solo.')
        )
      ),

      // ══ ABA 3 · EXPORTAR ══════════════════════════════════════
      tab===3&&h('section',{className:'card'},
        h('h2',{className:'card-title'},h(Icon,{n:'download'}),'5 · Exportação'),
        !tins&&h('div',{className:'alert alert-info',style:{marginBottom:'10px'}},
          'Gere o TIN antes de exportar.'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}},
          h('button',{className:'btn btn-pri',onClick:doGLB,disabled:isBusy||!tins},
            h(Icon,{n:'download'}),busy==='glb'?'Gerando GLB…':'Baixar TIN em GLB'),
          h('button',{className:'btn btn-out',onClick:doGeoJSON,disabled:isBusy||!tins},
            h(Icon,{n:'download'}),'Baixar GeoJSON 3D'),
          h('button',{className:'btn btn-out',onClick:doGltfCena,disabled:isBusy},
            h(Icon,{n:'download'}),busy==='gltf'?'Exportando…':'Exportar cena 3D do Giraffe')),
        h('p',{className:'hint',style:{marginTop:'10px'}},
          'O GLB local usa metros com origem no centro da área (Y para cima), um material por uso do solo. A exportação da cena usa getGltf e inclui todo o modelo visível no Giraffe.')
      ),

      // ─ Log (sempre visível)
      h('section',{className:'card'},
        h('h2',{className:'card-title'},'Log'),
        h('div',{className:'log',ref:logEl,role:'log','aria-live':'polite','aria-label':'Registro de operações'},
          logs.length===0
            ?h('span',{className:'l-info'},'Pronto.')
            :logs.map((l,i)=>h('div',{key:i},
                h('span',{className:'l-ts'},'['+l.ts+'] '),
                h('span',{className:'l-'+l.t},l.m))))
      )
    ),

    // ─ Footer
    h('footer',{className:'app-footer'},
      h('span',null,VERSION),
      h('span',null,'© 2026 Königsberger Vannucchi')
    )
  );
}

createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
